services:
  public-interface:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      SERVICE_MODE: ${SERVICE_MODE:-demo}
      DATABASE_PATH: /app/data/waste_sorting.sqlite3
      RECOGNITION_API_URL: ${RECOGNITION_API_URL:-}
      GUIDANCE_API_URL: ${GUIDANCE_API_URL:-}
      RECOGNITION_API_KEY: ${RECOGNITION_API_KEY:-}
      GUIDANCE_API_KEY: ${GUIDANCE_API_KEY:-}
    volumes:
      - submission-data:/app/data
    restart: unless-stopped
volumes:
  submission-data:
