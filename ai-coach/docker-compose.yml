services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_only
      MYSQL_DATABASE: waste_assistant
      MYSQL_USER: capstone
      MYSQL_PASSWORD: capstone_dev
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  web:
    build: .
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: waste_assistant
      MYSQL_USER: capstone
      MYSQL_PASSWORD: capstone_dev
      GEMINI_API_KEY: "REPLACE_WITH_GEMINI_API_KEY"
      ADMIN_API_TOKEN: "REPLACE_WITH_ADMIN_API_TOKEN"
    ports: ["5000:5000"]
    depends_on: [db]
volumes:
  mysql_data:
