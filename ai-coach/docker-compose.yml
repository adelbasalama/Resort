services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_only
      MYSQL_DATABASE: waste_assistant
      MYSQL_USER: capstone
      MYSQL_PASSWORD: capstone_dev
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  web:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      MYSQL_HOST: db
      MYSQL_DATABASE: waste_assistant
      MYSQL_USER: capstone
      MYSQL_PASSWORD: capstone_dev
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_COACH_MODEL: ${OPENAI_COACH_MODEL:-gpt-4.1-mini}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
    ports: ["5000:5000"]
    depends_on: [db]
volumes:
  mysql_data:
