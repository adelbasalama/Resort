<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Recycling Guide</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main>
        <header>
            <p class="eyebrow">Waste sorting assistant</p>
            <h1>Find the right place for it.</h1>
            <p>Choose your region and enter a recognized item to see reviewed local guidance.</p>
        </header>
        <form id="guide"><label>Region<select name="region_id" required>
                    <option value="">Choose a region</option>{% for region in regions %}<option value="{{ region.id }}">
                        {{ region.name }}</option>{% endfor %}
                </select></label><label>Item key<input name="item_key" placeholder="beverage_can"
                    required></label><label>Condition<select name="condition">
                    <option>unknown</option>
                    <option>clean</option>
                    <option>soiled</option>
                </select></label><button>Show guidance</button></form>
        <section id="result" aria-live="polite"></section>
    </main>
    <script>
        document.querySelector('#guide').addEventListener('submit', async e => { e.preventDefault(); const box = document.querySelector('#result'); box.textContent = 'Checking the local rule…'; try { const r = await fetch('/api/guidance', { method: 'POST', body: new FormData(e.target) }); const data = await r.json(); if (!r.ok) throw new Error(data.message); box.innerHTML = `<h2>${data.category}: ${data.bin_label}</h2><p>${data.preparation}</p><p>${data.explanation}</p><a href="${data.source_url}" target="_blank" rel="noopener">Official rule (reviewed ${data.reviewed_on})</a>`; } catch (err) { box.textContent = err.message; } });
    </script>
</body>

</html>
