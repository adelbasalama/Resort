services:
  recognition:
    build: .
    working_dir: /project/WasteRecognition
    command: python app.py
    environment:
      HOST: 0.0.0.0
      PORT: 5001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  guidance:
    build: .
    working_dir: /project/ai-coach
    command: python -m app.main
    environment:
      HOST: 0.0.0.0
      PORT: 5002
      RULES_BACKEND: sqlite
      RULES_DATABASE_PATH: /data/rules.sqlite3
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_COACH_MODEL: ${OPENAI_COACH_MODEL:-gpt-4.1-mini}
      COACH_TIMEOUT_SECONDS: 8
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
    ports: ["127.0.0.1:${GUIDANCE_PORT:-5002}:5002"]
    volumes: ["rules:/data"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5002/v1/regions')"]
      interval: 5s
      timeout: 3s
      retries: 10
  public-interface:
    build: .
    working_dir: /project/web interface
    command: python -m streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --browser.gatherUsageStats=false
    ports: ["127.0.0.1:${WEB_PORT:-8501}:8501"]
    environment:
      SERVICE_MODE: http
      ALLOW_INSECURE_LOCAL_HTTP: "true"
      RECOGNITION_API_URL: http://recognition:5001
      GUIDANCE_API_URL: http://guidance:5002
      RECOGNITION_TIMEOUT_SECONDS: 30
      GUIDANCE_TIMEOUT_SECONDS: 15
      DATABASE_PATH: /data/waste_sorting.sqlite3
    volumes: ["submissions:/data"]
    depends_on:
      recognition: {condition: service_healthy}
      guidance: {condition: service_healthy}
  dashboard:
    build: .
    working_dir: /project/subsystem4_dashboard
    command: python app.py
    ports: ["127.0.0.1:${DASHBOARD_PORT:-5003}:5003"]
    environment:
      HOST: 0.0.0.0
      PORT: 5003
      DATABASE_PATH: /data/waste_sorting.sqlite3
      GUIDANCE_API_URL: http://guidance:5002
    # SQLite's WAL reader may need to create -wal/-shm sidecar files after a restart.
    # The application opens the database with mode=ro and PRAGMA query_only=ON.
    volumes: ["submissions:/data"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  database-tools:
    build: .
    profiles: ["tools"]
    working_dir: /project
    entrypoint: [python, tools/databases.py]
    command: [--help]
    environment:
      RULES_DATABASE_PATH: /rules/rules.sqlite3
      DATABASE_PATH: /submissions/waste_sorting.sqlite3
    volumes:
      - rules:/rules
      - submissions:/submissions
      - ./backups:/backups
volumes:
  submissions:
  rules:
